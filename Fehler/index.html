<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Podcast derzeit nicht verfügbar</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Serif+Pro:wght@400;600&display=swap');

  :root {
    --navy: #1b2a41;
    --navy-dark: #0f1a29;
    --gold: #b08d57;
    --gold-light: #cba36b;
    --paper: #f7f5f0;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    font-family: 'Source Serif Pro', Georgia, serif;
    color: var(--navy-dark);
    padding: 40px 20px;
  }

  .card {
    max-width: 640px;
    width: 100%;
    background: #fff;
    border: 1px solid #ddd6c9;
    box-shadow: 0 10px 40px rgba(15, 26, 41, 0.12);
    position: relative;
    overflow: hidden;
  }

  .top-bar {
    height: 8px;
    background: linear-gradient(90deg, var(--navy) 0%, var(--gold) 50%, var(--navy) 100%);
  }

  .content {
    padding: 56px 52px 48px;
    text-align: center;
  }

  .emblem {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .emblem svg {
    width: 30px;
    height: 30px;
    fill: var(--navy);
  }

  .eyebrow {
    font-family: 'Source Serif Pro', serif;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--gold);
    font-weight: 600;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    line-height: 1.4;
    color: var(--navy);
    margin: 0 0 22px;
    font-weight: 700;
  }

  .divider {
    width: 60px;
    height: 2px;
    background: var(--gold);
    margin: 0 auto 26px;
  }

  p.message {
    font-size: 17px;
    line-height: 1.75;
    color: #333;
    margin: 0 0 8px;
  }

  .footnote {
    margin-top: 36px;
    font-size: 13px;
    color: #8a8478;
    font-style: italic;
    letter-spacing: 0.3px;
  }

  .bottom-rule {
    height: 4px;
    background: var(--navy);
  }

  @media (max-width: 480px) {
    .content { padding: 40px 26px 34px; }
    h1 { font-size: 22px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="top-bar"></div>
    <div class="content">
      <div class="emblem">
        <svg viewBox="0 0 24 24"><path d="M12 2 4 6v6c0 5.25 3.4 9.74 8 11 4.6-1.26 8-5.75 8-11V6l-8-4zm0 2.2 6 3v4.8c0 4.3-2.7 8-6 9.1-3.3-1.1-6-4.8-6-9.1V7.2l6-3z"/></svg>
      </div>
      <div class="eyebrow">Hinweis</div>
      <h1>Aufgrund technischer Schwierigkeiten ist dieser Podcast aktuell nicht verfügbar.</h1>
      <div class="divider"></div>
      <p class="message">Wir arbeiten daran.</p>
      <div class="footnote">Wir bitten um Ihr Verständnis.</div>
    </div>
    <div class="bottom-rule"></div>
  </div>
</body>
</html>
